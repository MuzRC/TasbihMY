<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TasbihMY - Digital Tasbih</title>

  <!-- PWA & Mobile Web Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Tetapan iOS Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TasbihMY">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font (Amiri untuk teks Arab) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* Elak highlight biru hodoh bila tap laju-laju di skrin telefon */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-arabic {
      font-family: 'Amiri', 'Traditional Arabic', serif;
    }
    /* Safe Area Padding untuk telefon skrin bertakuk (Notch/Dynamic Island) */
    .safe-top {
      padding-top: env(safe-area-inset-top, 1rem);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 1rem);
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-hidden safe-top safe-bottom">

  <!-- ================= HEADER ================= -->
  <header class="px-5 py-3 border-b border-slate-800/80 flex justify-between items-center bg-slate-900/60 backdrop-blur">
    <div>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <h1 class="text-xl font-black tracking-wider text-emerald-400">Tasbih<span class="text-white">MY</span></h1>
      </div>
      <p class="text-[11px] text-slate-400">Peringatan & Wirid Harian</p>
    </div>

    <!-- Butang Kawalan Atas -->
    <div class="flex items-center gap-2">
      <!-- Butang Bunyi -->
      <button id="soundBtn" onclick="toggleSound()" class="px-3 py-1.5 rounded-xl bg-slate-800/90 text-xs border border-slate-700/80 active:scale-95 transition-all flex items-center gap-1.5 font-medium">
        <span id="soundIcon">🔊</span>
        <span id="soundText" class="text-emerald-400 font-bold">ON</span>
      </button>

      <!-- Butang Reset -->
      <button onclick="confirmReset()" class="px-3 py-1.5 rounded-xl bg-rose-950/40 text-rose-400 text-xs border border-rose-800/50 active:scale-95 transition-all font-semibold hover:bg-rose-900/40">
        Reset
      </button>
    </div>
  </header>

  <!-- ================= KANDUNGAN UTAMA ================= -->
  <main class="flex-1 flex flex-col justify-between px-4 py-3 max-w-md mx-auto w-full">
    
    <!-- Bahagian Atas: Pilihan Zikir & Kad Paparan -->
    <div class="space-y-3">
      <!-- Dropdown Zikir -->
      <div>
        <label for="zikirSelect" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Pilih Zikir:</label>
        <div class="relative">
          <select id="zikirSelect" onchange="onZikirChanged()" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 appearance-none font-medium">
            <!-- Pilihan dijanakan oleh JavaScript -->
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
          </div>
        </div>
      </div>

      <!-- Kad Teks Zikir (Arab, Rumi & Terjemahan) -->
      <div class="bg-gradient-to-b from-slate-900/90 to-slate-900/50 border border-slate-800 rounded-2xl p-4 text-center shadow-lg min-h-[145px] flex flex-col justify-center">
        <p id="arabicText" class="text-2xl md:text-3xl font-arabic text-emerald-300 leading-relaxed mb-1.5" dir="rtl"></p>
        <p id="rumiText" class="text-xs text-slate-300 font-medium italic mb-1"></p>
        <p id="meaningText" class="text-[11px] text-slate-400 leading-relaxed"></p>
      </div>

      <!-- Bar Statistik Cepat -->
      <div class="grid grid-cols-3 gap-2 text-center bg-slate-900/40 border border-slate-800/60 rounded-xl p-2 text-xs">
        <div>
          <span class="block text-[10px] text-slate-500 uppercase font-semibold">Sasaran</span>
          <span id="targetDisplay" class="font-bold text-slate-200">33</span>
        </div>
        <div>
          <span class="block text-[10px] text-slate-500 uppercase font-semibold">Pusingan</span>
          <span id="roundDisplay" class="font-bold text-emerald-400">0</span>
        </div>
        <div>
          <span class="block text-[10px] text-slate-500 uppercase font-semibold">Semua (Total)</span>
          <span id="totalDisplay" class="font-bold text-cyan-400">0</span>
        </div>
      </div>
    </div>

    <!-- Bahagian Tengah: Butang Tasbih Ergonomik -->
    <div class="flex flex-col items-center justify-center my-auto py-2">
      <button id="counterButton" onclick="onTapCounter()" class="w-60 h-60 sm:w-64 sm:h-64 rounded-full bg-gradient-to-b from-slate-800 to-slate-900 border-4 border-emerald-500/30 shadow-[0_0_60px_rgba(16,185,129,0.12)] active:scale-95 transition-transform duration-100 flex flex-col items-center justify-center relative group focus:outline-none">
        
        <!-- Gelang visual kilat bila capai pusingan -->
        <div id="flashRing" class="absolute inset-0 rounded-full border-4 border-emerald-400 opacity-0 transition-opacity duration-300 pointer-events-none"></div>

        <span class="text-[11px] uppercase tracking-widest text-emerald-400/80 mb-1 font-semibold">Kiraan Semasa</span>
        <span id="countDisplay" class="text-6xl sm:text-7xl font-black text-white font-mono tracking-tighter leading-none">0</span>
        <span class="text-[10px] text-slate-500 mt-2 font-medium">Sentuh bulatan untuk kira</span>
      </button>
    </div>

    <!-- Bahagian Bawah: Tetapan Pantas Sasaran (Target) -->
    <div class="space-y-1.5">
      <div class="flex justify-between items-center px-1">
        <span class="text-[11px] text-slate-400 font-semibold uppercase">Pilihan Had Sasaran:</span>
      </div>
      <div class="grid grid-cols-4 gap-2">
        <button onclick="setTarget(33)" class="target-btn py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-200 active:scale-95 transition-all hover:border-emerald-500">33</button>
        <button onclick="setTarget(99)" class="target-btn py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-200 active:scale-95 transition-all hover:border-emerald-500">99</button>
        <button onclick="setTarget(100)" class="target-btn py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-200 active:scale-95 transition-all hover:border-emerald-500">100</button>
        <button onclick="setTarget(Infinity)" class="target-btn py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-200 active:scale-95 transition-all hover:border-emerald-500">∞</button>
      </div>
    </div>

  </main>

  <!-- ================= JAVASCRIPT LOGIK & ENGINE ================= -->
  <script>
    // 1. Senarai Lengkap Tasbih & Zikir
    const zikirDatabase = [
      {
        id: "subhanallah",
        name: "Subhanallah (Tasbih Fatimah)",
        arabic: "سُبْحَانَ اللَّهِ",
        rumi: "Subhanallah",
        meaning: "Maha Suci Allah",
        defaultTarget: 33
      },
      {
        id: "alhamdulillah",
        name: "Alhamdulillah (Tasbih Fatimah)",
        arabic: "الْحَمْدُ لِلَّهِ",
        rumi: "Alhamdulillah",
        meaning: "Segala puji bagi Allah",
        defaultTarget: 33
      },
      {
        id: "allahuakbar",
        name: "Allahu Akbar (Tasbih Fatimah)",
        arabic: "اللَّهُ أَكْبَرُ",
        rumi: "Allahu Akbar",
        meaning: "Allah Maha Besar",
        defaultTarget: 33
      },
      {
        id: "tahlil_lengkap",
        name: "Penyempurna 100 Lepas Solat",
        arabic: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
        rumi: "Laa ilaaha illallahu wahdahu laa syariika lah, lahul mulku wa lahul hamdu wa Huwa 'ala kulli syai'in Qadiir",
        meaning: "Tiada Tuhan selain Allah Yang Esa, tiada sekutu bagi-Nya. Bagi-Nya kerajaan dan pujian, dan Dia Maha Kuasa atas segala sesuatu.",
        defaultTarget: 1
      },
      {
        id: "yunus",
        name: "Doa Nabi Yunus (Pelepas Kesukaran)",
        arabic: "لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",
        rumi: "Laa ilaaha illaa Anta subhaanaka innii kuntu minaz-zaalimiin",
        meaning: "Tiada Tuhan selain Engkau, Maha Suci Engkau, sesungguhnya aku adalah dari kalangan orang-orang yang zalim.",
        defaultTarget: 100
      },
      {
        id: "tahmid_tamjid",
        name: "Dua Kalimah Ringkas & Berat Timbangan",
        arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ",
        rumi: "Subhanallahi wa bihamdihi, Subhanallahil 'azim",
        meaning: "Maha Suci Allah dengan segala puji-Nya, Maha Suci Allah Yang Maha Agung.",
        defaultTarget: 100
      },
      {
        id: "hauqalah",
        name: "Hauqalah (Simpanan Syurga)",
        arabic: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ",
        rumi: "Laa hawla wa laa quwwata illaa billaahil 'aliyyil 'aziim",
        meaning: "Tiada daya dan tiada kekuatan melainkan dengan pertolongan Allah Yang Maha Tinggi lagi Maha Agung.",
        defaultTarget: 100
      },
      {
        id: "istighfar",
        name: "Istighfar Ringkas",
        arabic: "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ وَأَتُوبُ إِلَيْهِ",
        rumi: "Astaghfirullahal 'aziim wa atuubu ilaih",
        meaning: "Aku memohon ampun kepada Allah Yang Maha Agung dan aku bertaubat kepada-Nya.",
        defaultTarget: 100
      },
      {
        id: "selawat",
        name: "Selawat Atas Nabi",
        arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ",
        rumi: "Allahumma salli 'ala Sayyidina Muhammad wa 'ala aali Sayyidina Muhammad",
        meaning: "Ya Allah, cucurilah rahmat ke atas junjungan kami Nabi Muhammad dan ke atas keluarga baginda.",
        defaultTarget: 100
      },
      {
        id: "sayyidul_istighfar",
        name: "Sayyidul Istighfar (Penghulu Istighfar)",
        arabic: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ",
        rumi: "Allahumma Anta Rabbii laa ilaaha illaa Anta, khalaqtanii wa anaa 'abduka, wa anaa 'alaa 'ahdika wa wa'dika mastatha'tu...",
        meaning: "Ya Allah, Engkau Rabbku, tiada tuhan selain Engkau. Engkau menciptakanku dan aku hamba-Mu...",
        defaultTarget: 3
      }
    ];

    // Status App
    let currentIdx = 0;
    let count = 0;
    let round = 0;
    let grandTotal = 0;
    let currentTarget = 33;
    let soundActive = true;

    // 2. Synthesizer Bunyi (Web Audio API - Jimat bateri & 100% offline)
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playBeep(freq = 600, duration = 0.04) {
      if (!soundActive) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn('Audio belum diaktifkan:', e);
      }
    }

    function playSuccessChime() {
      if (!soundActive) return;
      playBeep(784, 0.08); // Nada G5
      setTimeout(() => playBeep(1046, 0.12), 80); // Nada C6
    }

    // 3. Setup Dropdown
    const selectElem = document.getElementById("zikirSelect");
    zikirDatabase.forEach((z, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = z.name;
      selectElem.appendChild(opt);
    });

    // 4. Pengendalian Logik Utama (Tap, Target, Reset)
    function onTapCounter() {
      count++;
      grandTotal++;
      
      // Bunyi tap
      playBeep(650, 0.03);

      // Getaran halus (haptic)
      if (navigator.vibrate) {
        navigator.vibrate(20);
      }

      // Semakan Target
      if (currentTarget !== Infinity && count >= currentTarget) {
        round++;
        count = 0;
        playSuccessChime();

        // Getaran istimewa pusingan lengkap
        if (navigator.vibrate) {
          navigator.vibrate([70, 40, 70]);
        }
        flashRingEffect();
      }

      updateUI();
      saveProgress();
    }

    function onZikirChanged() {
      currentIdx = parseInt(selectElem.value);
      count = 0;
      round = 0;
      currentTarget = zikirDatabase[currentIdx].defaultTarget;
      updateUI();
      saveProgress();
    }

    function setTarget(val) {
      currentTarget = val;
      updateUI();
      saveProgress();
    }

    function toggleSound() {
      soundActive = !soundActive;
      const text = document.getElementById("soundText");
      const icon = document.getElementById("soundIcon");
      if (soundActive) {
        text.innerText = "ON";
        text.className = "text-emerald-400 font-bold";
        icon.innerText = "🔊";
      } else {
        text.innerText = "OFF";
        text.className = "text-rose-400 font-bold";
        icon.innerText = "🔇";
      }
      saveProgress();
    }

    function confirmReset() {
      if (confirm("Reset semula kiraan bagi zikir ini? (Kiraan jumlah keseluruhan tidak dipadam)")) {
        count = 0;
        round = 0;
        updateUI();
        saveProgress();
      }
    }

    function flashRingEffect() {
      const ring = document.getElementById("flashRing");
      ring.classList.remove("opacity-0");
      ring.classList.add("opacity-100");
      setTimeout(() => {
        ring.classList.remove("opacity-100");
        ring.classList.add("opacity-0");
      }, 400);
    }

    // 5. Kemas Kini Paparan (UI)
    function updateUI() {
      const activeZikir = zikirDatabase[currentIdx];
      document.getElementById("arabicText").innerText = activeZikir.arabic;
      document.getElementById("rumiText").innerText = activeZikir.rumi;
      document.getElementById("meaningText").innerText = `"${activeZikir.meaning}"`;
      
      document.getElementById("countDisplay").innerText = count;
      document.getElementById("roundDisplay").innerText = round;
      document.getElementById("totalDisplay").innerText = grandTotal;
      document.getElementById("targetDisplay").innerText = (currentTarget === Infinity) ? "Bebas" : currentTarget;
    }

    // 6. Simpanan Memori (Local Storage)
    function saveProgress() {
      const state = {
        currentIdx,
        count,
        round,
        grandTotal,
        currentTarget,
        soundActive
      };
      localStorage.setItem("tasbihmy_db_v1", JSON.stringify(state));
    }

    function loadProgress() {
      const saved = localStorage.getItem("tasbihmy_db_v1");
      if (saved) {
        try {
          const s = JSON.parse(saved);
          currentIdx = s.currentIdx || 0;
          count = s.count || 0;
          round = s.round || 0;
          grandTotal = s.grandTotal || 0;
          currentTarget = s.currentTarget !== undefined ? s.currentTarget : zikirDatabase[currentIdx].defaultTarget;
          soundActive = s.soundActive !== undefined ? s.soundActive : true;
          
          selectElem.value = currentIdx;
          if (!soundActive) {
            document.getElementById("soundText").innerText = "OFF";
            document.getElementById("soundText").className = "text-rose-400 font-bold";
            document.getElementById("soundIcon").innerText = "🔇";
          }
        } catch(e) {
          console.error("Gagal muat memori lama", e);
        }
      }
      updateUI();
    }

    // Jalankan pemuatan data bila skrip sedia
    loadProgress();

    // 7. Pendaftaran Service Worker (Auto Force-Update Mechanism)
    if ('serviceWorker' in navigator) {
      let refreshing = false;

      // Auto-reload serta-merta bila Service Worker baru ambil alih
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('[TasbihMY] Versi baru dikesan. Memuat semula skrin secara automatik...');
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('[TasbihMY] Service Worker Aktif.');
            // Paksa browser semak server untuk fail sw.js baru setiap kali dibuka
            reg.update();
          })
          .catch((err) => console.error('[TasbihMY] SW Pendaftaran Gagal:', err));
      });
    }
  </script>
</body>
</html>
