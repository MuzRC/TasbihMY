<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TasbihMY - Digital Tasbih</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between select-none">

  <!-- Header -->
  <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/60 backdrop-blur">
    <div>
      <h1 class="text-xl font-bold tracking-wider text-emerald-400">Tasbih<span class="text-white">MY</span></h1>
      <p class="text-xs text-slate-400">Peringatan & Kiraan Harian</p>
    </div>
    <div class="flex items-center gap-2">
      <button id="soundToggleBtn" onclick="toggleSound()" class="p-2 rounded-lg bg-slate-800 text-xs border border-slate-700">
        🔊 Bunyi: <span id="soundStatus" class="font-bold text-emerald-400">ON</span>
      </button>
      <button onclick="resetCounter()" class="p-2 px-3 rounded-lg bg-rose-950/40 text-rose-400 text-xs border border-rose-800/60 font-semibold active:scale-95">
        Reset
      </button>
    </div>
  </header>

  <!-- Content & Selector -->
  <main class="flex-1 flex flex-col justify-between p-4 max-w-md mx-auto w-full">
    
    <!-- Pilih Zikir & Target -->
    <div class="space-y-3">
      <div>
        <label class="text-xs text-slate-400 font-medium">Pilihan Zikir:</label>
        <select id="zikirSelect" onchange="changeZikir()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
          <!-- Diisi oleh script -->
        </select>
      </div>

      <!-- Kad Teks Zikir -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 text-center shadow-lg">
        <p id="arabicText" class="text-2xl font-serif text-emerald-300 leading-relaxed mb-2 font-arabic" dir="rtl"></p>
        <p id="rumiText" class="text-xs text-slate-300 italic mb-1"></p>
        <p id="meaningText" class="text-[11px] text-slate-400"></p>
      </div>

      <!-- Status Pusingan & Target -->
      <div class="flex justify-between items-center px-2 text-xs text-slate-400">
        <div>Target: <span id="targetDisplay" class="font-bold text-slate-200">33</span></div>
        <div>Pusingan: <span id="roundDisplay" class="font-bold text-emerald-400">0</span></div>
      </div>
    </div>

    <!-- Zon Tekan Besar (Ergonomik) -->
    <div class="flex flex-col items-center justify-center my-6">
      <button id="tapBtn" onclick="incrementCounter()" class="w-64 h-64 rounded-full bg-gradient-to-b from-slate-800 to-slate-900 border-4 border-emerald-500/40 shadow-[0_0_50px_rgba(16,185,129,0.15)] active:scale-95 transition-transform flex flex-col items-center justify-center relative overflow-hidden group">
        <div id="glowRing" class="absolute inset-0 rounded-full bg-emerald-500/10 opacity-0 transition-opacity duration-300 pointer-events-none"></div>
        <span class="text-xs uppercase tracking-widest text-emerald-400/80 mb-2 font-medium">Kiraan</span>
        <span id="counterDisplay" class="text-6xl font-black text-white font-mono tracking-tight">0</span>
        <span class="text-[10px] text-slate-500 mt-2">Sentuh mana-mana</span>
      </button>
    </div>

    <!-- Pilihan Cepat Target -->
    <div class="grid grid-cols-4 gap-2 mb-2">
      <button onclick="setTarget(33)" class="target-btn py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold hover:border-emerald-500">33</button>
      <button onclick="setTarget(99)" class="target-btn py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold hover:border-emerald-500">99</button>
      <button onclick="setTarget(100)" class="target-btn py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold hover:border-emerald-500">100</button>
      <button onclick="setTarget(Infinity)" class="target-btn py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold hover:border-emerald-500">∞</button>
    </div>

  </main>

  <script>
    const zikirList = [
      {
        id: "fatimah_subhanallah",
        name: "Tasbih Fatimah: Subhanallah",
        arabic: "سُبْحَانَ اللَّهِ",
        rumi: "Subhanallah",
        meaning: "Maha Suci Allah",
        defaultTarget: 33
      },
      {
        id: "fatimah_alhamdulillah",
        name: "Tasbih Fatimah: Alhamdulillah",
        arabic: "الْحَمْدُ لِلَّهِ",
        rumi: "Alhamdulillah",
        meaning: "Segala puji bagi Allah",
        defaultTarget: 33
      },
      {
        id: "fatimah_allahuakbar",
        name: "Tasbih Fatimah: Allahu Akbar",
        arabic: "اللَّهُ أَكْبَرُ",
        rumi: "Allahu Akbar",
        meaning: "Allah Maha Besar",
        defaultTarget: 33
      },
      {
        id: "yunus",
        name: "Tasbih Nabi Yunus",
        arabic: "لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",
        rumi: "Laa ilaaha illaa Anta subhaanaka innii kuntu minaz-zaalimiin",
        meaning: "Tiada Tuhan selain Engkau, Maha Suci Engkau, sesungguhnya aku termasuk orang yang zalim.",
        defaultTarget: 100
      },
      {
        id: "istighfar",
        name: "Istighfar Ringkas",
        arabic: "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ",
        rumi: "Astaghfirullahal 'aziim",
        meaning: "Aku memohon ampun kepada Allah Yang Maha Agung",
        defaultTarget: 100
      },
      {
        id: "selawat",
        name: "Selawat Ke Atas Nabi",
        arabic: "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ",
        rumi: "Allahumma salli 'ala Sayyidina Muhammad",
        meaning: "Ya Allah, limpahkanlah rahmat ke atas junjungan kami Nabi Muhammad",
        defaultTarget: 100
      },
      {
        id: "tahmid_tamjid",
        name: "Tasbih Ringkas 2 Kalimah",
        arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ",
        rumi: "Subhanallahi wa bihamdihi, Subhanallahil 'aziim",
        meaning: "Maha Suci Allah dengan segala puji-Nya, Maha Suci Allah Yang Maha Agung",
        defaultTarget: 100
      },
      {
        id: "hauqalah",
        name: "Hauqalah (Kekuatan & Perlindungan)",
        arabic: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ",
        rumi: "La hawla wa la quwwata illa billahil 'aliyyil 'aziim",
        meaning: "Tiada daya dan upaya kecuali dengan pertolongan Allah Yang Maha Tinggi lagi Maha Agung",
        defaultTarget: 33
      }
    ];

    let currentZikirIndex = 0;
    let count = 0;
    let round = 0;
    let target = 33;
    let isSoundOn = true;

    // Web Audio Synthesizer (Tiada perlukan fail audio luar)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound(frequency = 600) {
      if (!isSoundOn) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // Inisialisasi Senarai Dropdown
    const selectElem = document.getElementById("zikirSelect");
    zikirList.forEach((item, index) => {
      const opt = document.createElement("option");
      opt.value = index;
      opt.innerText = item.name;
      selectElem.appendChild(opt);
    });

    function loadState() {
      const saved = localStorage.getItem("tasbihmy_state");
      if (saved) {
        const data = JSON.parse(saved);
        currentZikirIndex = data.index || 0;
        count = data.count || 0;
        round = data.round || 0;
        target = data.target || zikirList[currentZikirIndex].defaultTarget;
        selectElem.value = currentZikirIndex;
      } else {
        target = zikirList[0].defaultTarget;
      }
      updateUI();
    }

    function saveState() {
      localStorage.setItem("tasbihmy_state", JSON.stringify({
        index: currentZikirIndex,
        count: count,
        round: round,
        target: target
      }));
    }

    function changeZikir() {
      currentZikirIndex = parseInt(selectElem.value);
      count = 0;
      round = 0;
      target = zikirList[currentZikirIndex].defaultTarget;
      updateUI();
      saveState();
    }

    function setTarget(val) {
      target = val;
      updateUI();
      saveState();
    }

    function incrementCounter() {
      count++;
      playClickSound(650);

      // Getaran harian (Web Haptics API)
      if (navigator.vibrate) {
        navigator.vibrate(25);
      }

      // Check Target
      if (target !== Infinity && count >= target) {
        round++;
        count = 0;
        playClickSound(950);
        // Getaran panjang menandakan habis 1 pusingan
        if (navigator.vibrate) {
          navigator.vibrate([80, 50, 80]);
        }
        flashGlow();
      }

      updateUI();
      saveState();
    }

    function resetCounter() {
      if (confirm("Reset kiraan untuk zikir ini?")) {
        count = 0;
        round = 0;
        updateUI();
        saveState();
      }
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      document.getElementById("soundStatus").innerText = isSoundOn ? "ON" : "OFF";
      document.getElementById("soundStatus").className = isSoundOn ? "font-bold text-emerald-400" : "font-bold text-rose-400";
    }

    function flashGlow() {
      const glow = document.getElementById("glowRing");
      glow.classList.remove("opacity-0");
      glow.classList.add("opacity-100");
      setTimeout(() => {
        glow.classList.remove("opacity-100");
        glow.classList.add("opacity-0");
      }, 400);
    }

    function updateUI() {
      const zikir = zikirList[currentZikirIndex];
      document.getElementById("arabicText").innerText = zikir.arabic;
      document.getElementById("rumiText").innerText = zikir.rumi;
      document.getElementById("meaningText").innerText = `"${zikir.meaning}"`;
      document.getElementById("counterDisplay").innerText = count;
      document.getElementById("roundDisplay").innerText = round;
      document.getElementById("targetDisplay").innerText = target === Infinity ? "Bebas (∞)" : target;
    }

    loadState();
  </script>
</body>
</html>
